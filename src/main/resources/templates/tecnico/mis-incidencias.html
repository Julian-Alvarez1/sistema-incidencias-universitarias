<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Incidencias - Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Mis Incidencias Asignadas</h2>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>#</th><th>Descripción</th><th>Estado Actual</th><th>Cambiar a</th><th>Observación</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inc : ${incidencias}">
                    <td th:text="${inc.id}">1</td>
                    <td th:text="${inc.descripcion}">...</td>
                    <td>
                        <span class="badge" th:classappend="${inc.estado == 'RESUELTA' ? 'bg-success' : inc.estado == 'EN_PROCESO' ? 'bg-info' : 'bg-warning'}"
                              th:text="${inc.estado}">Estado</span>
                    </td>
                    <td>
                        <form th:action="@{/tecnico/incidencia/{id}/estado(id=${inc.id})}" method="post" class="d-flex gap-2">
                            <select name="nuevoEstado" class="form-select form-select-sm" required>
                                <option value="EN_PROCESO">En Proceso</option>
                                <option value="RESUELTA">Resuelta</option>
                            </select>
                            <input type="text" name="observacion" class="form-control form-control-sm" placeholder="Observación de trabajo">
                            <button type="submit" class="btn btn-sm btn-primary">Actualizar</button>
                        </form>
                    </td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(incidencias)}" class="text-center text-muted mt-3">
        No tienes incidencias asignadas en proceso.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
