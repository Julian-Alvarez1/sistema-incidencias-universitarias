<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
<div class="login-card">
    <h2 class="text-center mb-4 text-primary">Iniciar Sesión</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${logout}" class="alert alert-info" th:text="${logout}"></div>

    <form th:action="@{/authenticate}" method="post">
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" name="username" class="form-control" required placeholder="correo@universidad.edu">
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>

    <div class="text-center mt-3">
        <small class="text-muted">
            Demo: admin@universidad.edu / admin123<br>
            Demo: tecnico@universidad.edu / tecnico123<br>
            Demo: estudiante@universidad.edu / estudiante123
        </small>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
