<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Consultar Incidencias</h2>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>#</th><th>Descripción</th><th>Tipo</th><th>Estado</th><th>Prioridad</th><th>Fecha</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inc : ${incidencias}">
                    <td th:text="${inc.id}">1</td>
                    <td th:text="${inc.descripcion}">...</td>
                    <td th:text="${inc.tipo.nombre}">Tipo</td>
                    <td>
                        <span class="badge" th:classappend="${inc.estado == 'RESUELTA' ? 'bg-success' : inc.estado == 'EN_PROCESO' ? 'bg-info' : inc.estado == 'ASIGNADA' ? 'bg-warning' : 'bg-secondary'}"
                              th:text="${inc.estado}">Estado</span>
                    </td>
                    <td th:text="${inc.prioridad}">Prioridad</td>
                    <td th:text="${#temporals.format(inc.fechaRegistro, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td>
                        <a th:href="@{/incidencias/{id}(id=${inc.id})}" class="btn btn-sm btn-outline-primary">Ver</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(incidencias)}" class="text-center text-muted mt-3">
        No hay incidencias registradas.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
