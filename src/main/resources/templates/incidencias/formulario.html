<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Incidencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Registrar Nueva Incidencia</h2>

    <div th:if="${param.creada}" class="alert alert-success">
        ¡Incidencia registrada correctamente!
    </div>

    <form th:action="@{/incidencias/guardar}" th:object="${incidencia}" method="post" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" rows="4" required></textarea>
        </div>
        <div class="col-md-4">
            <label class="form-label">Tipo de Incidencia</label>
            <select th:field="*{tipo.id}" class="form-select" required>
                <option value="">Seleccione un tipo</option>
                <option th:each="tipo : ${tipos}" th:value="${tipo.id}" th:text="${tipo.nombre}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Ubicación</label>
            <select th:field="*{ubicacion.id}" class="form-select" required>
                <option value="">Seleccione ubicación</option>
                <option th:each="ubi : ${ubicaciones}" th:value="${ubi.id}" th:text="${ubi.toString()}"></option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Registrar Incidencia</button>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
