<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Incidencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/incidencias}">Volver</a>
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Incidencia #<span th:text="${incidencia.id}">1</span></h2>

    <div class="row">
        <div class="col-md-6">
            <p><strong>Descripción:</strong> <span th:text="${incidencia.descripcion}"></span></p>
            <p><strong>Tipo:</strong> <span th:text="${incidencia.tipo.nombre}"></span></p>
            <p><strong>Ubicación:</strong> <span th:text="${incidencia.ubicacion.toString()}"></span></p>
            <p><strong>Reportante:</strong> <span th:text="${incidencia.reportante.nombre}"></span></p>
        </div>
        <div class="col-md-6">
            <p><strong>Estado:</strong>
                <span class="badge" th:classappend="${incidencia.estado == 'RESUELTA' ? 'bg-success' : incidencia.estado == 'EN_PROCESO' ? 'bg-info' : incidencia.estado == 'ASIGNADA' ? 'bg-warning' : 'bg-secondary'}"
                      th:text="${incidencia.estado}">Estado</span>
            </p>
            <p><strong>Prioridad:</strong> <span th:text="${incidencia.prioridad}"></span></p>
            <p><strong>Fecha de registro:</strong> <span th:text="${#temporals.format(incidencia.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></span></p>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(incidencia.historiales)}" class="mt-4">
        <h5>Historial de Estados</h5>
        <table class="table table-sm">
            <thead>
                <tr><th>Estado Anterior</th><th>Estado Nuevo</th><th>Fecha</th><th>Usuario</th></tr>
            </thead>
            <tbody>
                <tr th:each="h : ${incidencia.historiales}">
                    <td th:text="${h.estadoAnterior}">-</td>
                    <td th:text="${h.estadoNuevo}">Nuevo</td>
                    <td th:text="${#temporals.format(h.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${h.usuario.nombre}">Usuario</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
