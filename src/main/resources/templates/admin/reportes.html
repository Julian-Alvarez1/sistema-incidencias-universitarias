<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Generar Reportes</h2>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/admin/reportes/nuevo}" class="btn btn-success">+ Nuevo Reporte</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>#</th><th>Tipo</th><th>Fecha Inicio</th><th>Fecha Fin</th><th>Administrador</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reportes}">
                    <td th:text="${r.id}">1</td>
                    <td th:text="${r.tipo}">Tipo</td>
                    <td th:text="${r.fechaInicio}">Fecha</td>
                    <td th:text="${r.fechaFin}">Fecha</td>
                    <td th:text="${r.administrador.nombre}">Admin</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
