<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Crear Nuevo Usuario</h2>

    <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post" class="row g-3">
        <div class="col-md-4">
            <label class="form-label">Nombre completo</label>
            <input th:field="*{nombre}" type="text" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Documento</label>
            <input th:field="*{documento}" type="text" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Correo</label>
            <input th:field="*{correo}" type="email" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Contraseña</label>
            <input th:field="*{claveHash}" type="password" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Rol</label>
            <select th:field="*{rol.id}" class="form-select" required>
                <option value="">Seleccione rol</option>
                <option th:value="1">ESTUDIANTE</option>
                <option th:value="2">DOCENTE</option>
                <option th:value="3">TECNICO</option>
                <option th:value="4">ADMINISTRADOR</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Estado</label>
            <select th:field="*{estado}" class="form-select">
                <option value="ACTIVO">Activo</option>
                <option value="INACTIVO">Inactivo</option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar Usuario</button>
            <a th:href="@{/admin/usuarios}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
