<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Gestión de Usuarios</h2>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-success">+ Nuevo Usuario</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>#</th><th>Nombre</th><th>Documento</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.nombre}">Nombre</td>
                    <td th:text="${u.documento}">Doc</td>
                    <td th:text="${u.correo}">correo</td>
                    <td th:text="${u.rol.nombre}">Rol</td>
                    <td>
                        <span class="badge" th:classappend="${u.estado == 'ACTIVO' ? 'bg-success' : 'bg-danger'}"
                              th:text="${u.estado}">Estado</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/usuarios/{id}/desactivar(id=${u.id})}" method="post"
                              th:if="${u.estado == 'ACTIVO'}" onsubmit="return confirm('¿Desactivar este usuario?')">
                            <button type="submit" class="btn btn-sm btn-danger">Desactivar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
