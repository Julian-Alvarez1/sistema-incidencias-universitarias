<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Asignar Incidencias a Técnicos</h2>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>#</th><th>Descripción</th><th>Tipo</th><th>Ubicación</th><th>Reportante</th><th>Asignar a</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inc : ${pendientes}">
                    <td th:text="${inc.id}">1</td>
                    <td th:text="${inc.descripcion}">...</td>
                    <td th:text="${inc.tipo.nombre}">Tipo</td>
                    <td th:text="${inc.ubicacion.toString()}">Ubicación</td>
                    <td th:text="${inc.reportante.nombre}">Reportante</td>
                    <td>
                        <form th:action="@{/admin/asignaciones/{idIncidencia}/asignar(idIncidencia=${inc.id})}" method="post" class="d-flex gap-2">
                            <select name="idTecnico" class="form-select form-select-sm" required>
                                <option value="">Seleccione técnico</option>
                                <option th:each="tec : ${tecnicos}" th:value="${tec.id}" th:text="${tec.nombre}"></option>
                            </select>
                            <input type="text" name="observacion" class="form-control form-control-sm" placeholder="Observación">
                            <button type="submit" class="btn btn-sm btn-success">Asignar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(pendientes)}" class="text-center text-muted mt-3">
        No hay incidencias pendientes de asignación.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
