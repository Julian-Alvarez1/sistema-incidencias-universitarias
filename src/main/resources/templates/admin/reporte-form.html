<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Reporte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Sistema de Incidencias</a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Generar Reporte</h2>

    <form th:action="@{/admin/reportes/guardar}" th:object="${reporte}" method="post" class="row g-3">
        <div class="col-md-4">
            <label class="form-label">Tipo de reporte</label>
            <select th:field="*{tipo}" class="form-select" required>
                <option value="POR_ESTADO">Por Estado</option>
                <option value="POR_TIPO">Por Tipo de Incidencia</option>
                <option value="POR_UBICACION">Por Ubicación</option>
                <option value="POR_TIEMPO">Por Tiempos de Atención</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Fecha Inicio</label>
            <input th:field="*{fechaInicio}" type="date" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Fecha Fin</label>
            <input th:field="*{fechaFin}" type="date" class="form-control" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Generar Reporte</button>
            <a th:href="@{/admin/reportes}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
