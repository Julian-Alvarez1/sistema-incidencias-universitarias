spring.application.name=Gestion

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_incidencias?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Inicializar esquema desde schema.sql al iniciar
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# Puerto del servidor
server.port=8080